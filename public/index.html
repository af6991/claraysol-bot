<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clara y Sol — Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fffdf5; color: #1a1a18; min-height: 100vh; }

  header {
    background: #fff;
    border-bottom: 1px solid #f0ead6;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo { font-size: 24px; }
  .brand { font-size: 18px; font-weight: 600; color: #7c4f1a; }
  .brand span { color: #e8a020; }
  .badge { font-size: 11px; background: #e8f5e9; color: #2e7d32; padding: 3px 10px; border-radius: 99px; font-weight: 500; margin-left: 4px; }
  .last-update { margin-left: auto; font-size: 12px; color: #aaa; }

  main { max-width: 960px; margin: 0 auto; padding: 28px 20px; }

  h2 { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 12px; }

  section { margin-bottom: 28px; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { background: #fff; border: 1px solid #f0ead6; border-radius: 12px; padding: 18px 20px; }
  .stat-label { font-size: 12px; color: #aaa; margin-bottom: 6px; }
  .stat-value { font-size: 26px; font-weight: 600; color: #7c4f1a; }

  /* Inventory */
  .inv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .inv-card { background: #fff; border: 1px solid #f0ead6; border-radius: 12px; padding: 18px 20px; }
  .inv-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .inv-name { font-weight: 600; font-size: 15px; }
  .inv-price { font-size: 12px; color: #aaa; margin-top: 3px; }
  .inv-count { font-size: 28px; font-weight: 700; }
  .inv-count.ok  { color: #7c4f1a; }
  .inv-count.low { color: #c0392b; }
  .bar { background: #f5ead6; border-radius: 99px; height: 7px; margin-bottom: 14px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 99px; transition: width .4s; }
  .bar-fill.ok  { background: #e8a020; }
  .bar-fill.low { background: #c0392b; }
  .stock-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .stock-row label { font-size: 12px; color: #aaa; }
  .stock-row input { width: 68px; padding: 6px 8px; border: 1px solid #e8dcc8; border-radius: 8px; font-size: 14px; text-align: center; background: #fffdf5; }
  .btn-save { padding: 6px 14px; background: #e8a020; color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-save:hover { background: #c98a10; }

  /* Orders */
  .orders-wrap { background: #fff; border: 1px solid #f0ead6; border-radius: 12px; overflow-x: auto; }
  table { width: 100%; min-width: 780px; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: .05em; padding: 11px 16px; border-bottom: 1px solid #f0ead6; background: #fffdf5; }
  td { padding: 11px 16px; border-bottom: 1px solid #faf5e8; color: #1a1a18; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fffbf0; }

  .pill { display: inline-block; font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 99px; }
  .pill-green  { background: #e8f5e9; color: #2e7d32; }
  .pill-blue   { background: #e3f2fd; color: #1565c0; }
  .pill-red    { background: #fce4ec; color: #b71c1c; }
  .pill-yellow { background: #fff8e1; color: #e65100; }

  select { padding: 4px 8px; border: 1px solid #e8dcc8; border-radius: 6px; font-size: 12px; background: #fffdf5; cursor: pointer; }
  .map-link { color: #e8a020; text-decoration: none; font-size: 12px; font-weight: 500; }
  .map-link:hover { text-decoration: underline; }
  .empty-row td { text-align: center; color: #ccc; padding: 40px; }

  .toast { position: fixed; bottom: 20px; right: 20px; background: #7c4f1a; color: #fff; padding: 11px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .stats { grid-template-columns: 1fr 1fr; }
    .inv-grid { grid-template-columns: 1fr; }
    header { padding: 14px 16px; }
    main { padding: 20px 14px; }
  }
</style>
</head>
<body>

<header>
  <span class="logo">🌻</span>
  <span class="brand">Clara <span>&</span> Sol</span>
  <span class="badge">● Bot activo</span>
  <span class="last-update" id="lastUpdate">Actualizando…</span>
</header>

<main>

  <section>
    <h2>Resumen de hoy</h2>
    <div class="stats">
      <div class="stat"><div class="stat-label">Pedidos hoy</div><div class="stat-value" id="s-orders">—</div></div>
      <div class="stat"><div class="stat-label">Cartones vendidos</div><div class="stat-value" id="s-cartons">—</div></div>
      <div class="stat"><div class="stat-label">Ventas (MXN)</div><div class="stat-value" id="s-sales">—</div></div>
      <div class="stat"><div class="stat-label">Stock total</div><div class="stat-value" id="s-stock">—</div></div>
    </div>
  </section>

  <section>
    <h2>Inventario</h2>
    <div class="inv-grid" id="invGrid">
      <div class="inv-card" style="color:#ccc;padding:30px;text-align:center">Cargando…</div>
    </div>
  </section>

  <section>
    <h2>Pedidos recientes</h2>
    <div class="orders-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Cliente</th>
            <th>Producto</th>
            <th>Cant.</th>
            <th>Total</th>
            <th>Ubicación</th>
            <th>Estado</th>
            <th>Fecha / Hora</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr class="empty-row"><td colspan="8">Cargando pedidos…</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<script>
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function loadData() {
    try {
      const r = await fetch('/api/data');
      if (!r.ok) throw new Error('Auth error');
      const data = await r.json();
      render(data);
      document.getElementById('lastUpdate').textContent =
        'Actualizado: ' + new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    } catch (e) {
      console.error(e);
    }
  }

  function render(data) {
    const today = new Date().toDateString();
    const todayOrders = data.orders.filter(o =>
      new Date(o.createdAt).toDateString() === today && o.status === 'accepted'
    );

    document.getElementById('s-orders').textContent  = todayOrders.length;
    document.getElementById('s-cartons').textContent = todayOrders.reduce((s, o) => s + o.quantity, 0);
    document.getElementById('s-sales').textContent   = '$' + todayOrders.reduce((s, o) => s + o.total, 0);
    document.getElementById('s-stock').textContent   = Object.values(data.inventory).reduce((s, v) => s + v.stock, 0);

    // Inventory cards (skip redraw while someone is typing in them, so the 15s refresh doesn't wipe their input)
    const ae = document.activeElement;
    const editingInv = !!(ae && ae.closest && ae.closest('#invGrid'));
    if (!editingInv) document.getElementById('invGrid').innerHTML = Object.entries(data.inventory).map(([key, inv]) => {
      const pct = Math.min(100, Math.round((inv.stock / 100) * 100));
      const low = inv.stock < 10;
      return `
        <div class="inv-card">
          <div class="inv-top">
            <div>
              <div class="inv-name">${inv.label}</div>
              <div class="inv-price">$${inv.price} MXN por cartón</div>
            </div>
            <div class="inv-count ${low ? 'low' : 'ok'}">${inv.stock}</div>
          </div>
          <div class="bar">
            <div class="bar-fill ${low ? 'low' : 'ok'}" style="width:${pct}%"></div>
          </div>
          <div class="stock-row">
            <label>Stock:</label>
            <input type="number" id="stock_${key}" value="${inv.stock}" min="0" max="9999">
            <label>Precio $:</label>
            <input type="number" id="price_${key}" value="${inv.price}" min="1" max="99999">
            <button class="btn-save" onclick="saveStock('${key}')">Guardar</button>
          </div>
        </div>`;
    }).join('');

    // Orders table (skip redraw while a status dropdown is open)
    if (ae && ae.closest && ae.closest('#ordersBody')) return;
    const sorted = [...data.orders].reverse();
    if (!sorted.length) {
      document.getElementById('ordersBody').innerHTML =
        '<tr class="empty-row"><td colspan="8">Aún no hay pedidos 🌻</td></tr>';
      return;
    }

    document.getElementById('ordersBody').innerHTML = sorted.slice(0, 100).map(o => {
      const dt   = new Date(o.createdAt);
      const time = dt.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
      const date = dt.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });
      const mapUrl = o.location
        ? `https://maps.google.com/?q=${o.location.latitude},${o.location.longitude}`
        : null;
      const locCell = mapUrl
        ? `<a class="map-link" href="${mapUrl}" target="_blank">📍 Ver mapa</a>`
        : '<span style="color:#ccc">—</span>';

      const phoneDigits = (o.phone || '').replace(/\D/g, '');
      const phoneShown  = (o.phone || '').replace('whatsapp:', '');
      const phoneCell = phoneDigits
        ? `<a class="map-link" href="https://wa.me/${phoneDigits}" target="_blank">💬 ${phoneShown}</a>`
        : '<span style="color:#ccc">—</span>';

      const statusOptions = [
        { value: 'accepted',  label: 'Aceptado',  cls: 'pill-green'  },
        { value: 'preparing', label: 'En camino', cls: 'pill-yellow' },
        { value: 'delivered', label: 'Entregado', cls: 'pill-blue'   },
        { value: 'cancelled', label: 'Cancelado', cls: 'pill-red'    },
      ];
      const statusSel = `
        <select onchange="updateStatus(${o.id}, this.value)">
          ${statusOptions.map(s =>
            `<option value="${s.value}" ${o.status === s.value ? 'selected' : ''}>${s.label}</option>`
          ).join('')}
        </select>`;

      return `<tr>
        <td style="font-weight:600;color:#7c4f1a">#${o.id}</td>
        <td>${phoneCell}</td>
        <td>${o.productLabel}</td>
        <td>${o.quantity}</td>
        <td style="font-weight:500">$${o.total}</td>
        <td>${locCell}</td>
        <td>${statusSel}</td>
        <td style="color:#aaa;font-size:12px">${date} · ${time}</td>
      </tr>`;
    }).join('');
  }

  async function saveStock(product) {
    const stock = document.getElementById('stock_' + product).value;
    const price = document.getElementById('price_' + product).value;
    const r = await fetch('/api/inventory', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ product, stock, price })
    });
    if (r.ok) {
      showToast('✅ Inventario actualizado');
      if (document.activeElement) document.activeElement.blur();
      await loadData();
    }
  }

  async function updateStatus(id, status) {
    await fetch('/api/orders/' + id + '/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status })
    });
    showToast('✅ Estado actualizado');
    if (document.activeElement) document.activeElement.blur();
    await loadData();
  }

  loadData();
  setInterval(loadData, 15000);
</script>
</body>
</html>
